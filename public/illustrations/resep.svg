<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Subtle shadow -->
  <ellipse cx="40" cy="68" rx="26" ry="6" fill="#BF360C" fill-opacity="0.12" />
  
  <!-- Modern ceramic cooking pot in warm apricot / terracotta -->
  <!-- Pot handles -->
  <rect x="12" y="42" width="8" height="6" rx="3" fill="#E65100" />
  <rect x="60" y="42" width="8" height="6" rx="3" fill="#E65100" />
  
  <!-- Pot base / body -->
  <path d="M18 38 L62 38 Q62 65 40 65 Q18 65 18 38 Z" fill="#FF7043" />
  <!-- 3D body gradient sheen -->
  <path d="M22 38 Q22 61 40 61 Q58 61 58 38 Q58 39 40 40 Q22 39 22 38 Z" fill="#FF8A65" fill-opacity="0.5" />
  <!-- Body highlight reflection -->
  <ellipse cx="30" cy="48" rx="4" ry="7" transform="rotate(-15 30 48)" fill="#FFA280" fill-opacity="0.6" />
  
  <!-- Pot rim -->
  <ellipse cx="40" cy="38" rx="22" ry="5.5" fill="#F4511E" />
  
  <!-- Pot lid slightly tilted open with culinary steam -->
  <path d="M40 34 C25 34 22 28 40 26 C58 24 55 34 40 34 Z" fill="#FFA726" />
  <ellipse cx="40" cy="30" rx="18" ry="4" fill="#FFB74D" />
