  <path d="M48 34 L59 18 Q62 16 64 19 Q65 22 62 25 L52 38 Z" fill="#D7CCC8" />
  <ellipse cx="61" cy="20" rx="3" ry="4" fill="#BCAAA4" transform="rotate(35 61 20)" />
  
  <!-- Gentle steam puffs -->
  <path d="M30 22 Q27 17 31 13 Q35 9 32 6" stroke="#FFE082" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M42 20 Q40 15 44 11 Q48 7 45 4" stroke="#FFE082" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
