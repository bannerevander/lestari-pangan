<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Template banner promosi Lestari Pangan (rasio 3:1). Buka di Canva/Figma, ganti teks dan gambar, ekspor JPG/PNG/WebP ≤ 2 MB. -->
  <!-- Hapus garis panduan (layer "panduan") sebelum ekspor. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F5E9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect x="760" y="0" width="440" height="400" fill="#2E7D32"/>
  <text x="980" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.85">Area foto / ilustrasi</text>
  <text x="980" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.7">440 × 400 px</text>
  <text x="80" y="120" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#2E7D32">LESTARI PANGAN</text>
  <text x="80" y="190" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#12212B">Judul promosi singkat</text>
  <text x="80" y="245" font-family="Inter, Arial, sans-serif" font-size="28" fill="#4A5A63">Satu kalimat penjelasan, maksimal dua baris.</text>
  <rect x="80" y="282" width="230" height="60" rx="30" fill="#2E7D32"/>
  <text x="195" y="321" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Ajakan</text>
  <g id="panduan" fill="none" stroke="#E53935" stroke-width="2" stroke-dasharray="10 8">
    <!-- Zona aman: teks penting di dalam kotak ini agar tidak terpotong di layar kecil. -->
    <rect x="60" y="40" width="1080" height="320"/>
  </g>
</svg>
